name: Launch health and alerts
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test_delivery:
        description: "Create and close an explicitly labelled owner delivery-test incident"
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: launch-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/monitor-launch.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MONITOR_TEST: ${{ inputs.test_delivery == true && 'true' || 'false' }}
