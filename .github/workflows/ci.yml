name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight runs for the same pull request. Pushing twice to a branch
# used to run both to completion. Keyed by SHA on push so a main run is never
# cancelled — nothing consumes this workflow's conclusion today, but a
# cancelled main run would silently become a gap if something ever does.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Caches the npm DOWNLOAD cache (~/.npm). Kept because it makes the
          # miss path below cheaper, but note it does not save the install:
          # `npm ci` still relinks the whole tree, which is where the 163s went.
          cache: npm

      # Cache the installed tree, not the downloads. This is the step that
      # actually removes the cost — `npm ci` is skipped entirely on a hit.
      # Keyed on the lockfile (what `npm ci` reads) plus the Node major, so a
      # dependency bump or a .nvmrc change reinstalls and nothing else does.
      - name: Cache node_modules
        id: modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.modules-cache.outputs.cache-hit != 'true'

      - run: npm run lint

      - run: npm run typecheck

      # Coverage answers "did a test execute this line", which is a weaker
      # question than "would a bug here be caught" — see the mutation workflow
      # for that. Summary is printed to the job log so the number is visible
      # without downloading anything.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}

      # Next inlines every NEXT_PUBLIC_* var into .next/static, so prefixing a
      # secret publishes it to every visitor with nothing visibly breaking.
      # The self-test runs first so a regex that stops matching fails loudly
      # rather than turning the scan into a no-op that always passes.
      - name: Verify secret scanner still detects
        run: npm run check:secrets:self-test

      - name: Scan client bundle for secrets
        run: npm run check:secrets

      # Asserts every URL in the generated sitemap was actually prerendered to
      # static HTML with a canonical, one h1, JSON-LD, an og:image, and real
      # prose. A page that silently becomes dynamic — a stray hook, a cookies()
      # call, a client-only import — still works in a browser but serves an
      # empty shell to a crawler that does not run JavaScript. The missing .html
      # is the only signal, and it does not exist until after a build.
      - name: Verify public routes prerendered
        run: npm run check:prerender
