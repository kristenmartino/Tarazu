name: Mutation

# Coverage tells you a line RAN. Mutation testing tells you the line is
# actually ASSERTED: Stryker injects bugs into the source one at a time and
# checks whether the test suite notices. Surviving mutants identify assertions
# to inspect; some are equivalent behavior rather than real faults.
#
# Runs for relevant pull requests, weekly, and on demand. The configured
# break threshold is 90. The score measures the selected deterministic modules;
# it does not measure AI accuracy or guarantee that surviving mutants are bugs.

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    # Keep logic and its tests/dependencies in scope. These marketing-data
    # modules are not mutation targets; their invariants still run in normal CI.
    # Exclusions must follow lib/**: GitHub applies paths in order.
    paths:
      - "lib/**"
      - "!lib/routes.js"
      - "!lib/site.js"
      - "!lib/contact.js"
      - "!lib/content/product.js"
      - "app/api/**"
      - "src/utils.js"
      - "src/utils.test.js"
      - "src/validate/**"
      - "src/hooks/**"
      - "stryker.config.json"
      - "vitest.config.*"
      - "vitest.setup.*"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".npmrc"
      - ".github/workflows/mutation.yml"

# Supersede in-flight runs for the same pull request; pushing twice used to run
# both to completion. Keyed by SHA on push so a branch/main run is never
# cancelled — cancellation follows workflow start order, not commit order, so
# cancelling a push run risks the newest commit never being the one validated.
concurrency:
  group: mutation-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Share the installed-tree cache used by CI/E2E. An exact lockfile,
      # Node-version-file and OS match is required; no partial restore keys.
      - name: Cache node_modules
        id: modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.modules-cache.outputs.cache-hit != 'true'

      - name: Run mutation testing
        run: npm run mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
